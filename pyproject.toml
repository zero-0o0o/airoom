[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airoom"
version = "0.1.0"
description = "Shared infrastructure and coordination layer for AI agents and tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18.0",
]
authors = [
    {name = "AIroom Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/zero-0o0o/airoom"
Repository = "https://github.com/zero-0o0o/airoom"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
airoom = "airoom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["airoom*"]

[tool.setuptools.package-data]
airoom = [
    "resources/skills/*/SKILL.md",
    "resources/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100